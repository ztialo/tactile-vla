dataset: data/peg_insert_expert_80.hdf5
output_dir: logs/diffusion/peg_insert_run1


epochs: 8
batch_size: 8
lr: 8.0e-5
weight_decay: 1.0e-6
state_action_normalization: limits
adam_betas: [0.95, 0.999]
adam_eps: 1.0e-8
val_split: 0.1
seed: 42
num_workers: 4
device: cuda
resume: false

max_train_episodes: 0
max_val_episodes: 0
max_train_steps: null
max_val_steps: null
gradient_accumulate_every: 1

n_obs_steps: 2
horizon: 16
n_action_steps: 8
num_inference_steps: 100

rotation_repr: rot9d
vision_encoder: resnet18_gn
image_normalization: zero_one
image_embed_dim: 128
obs_feature_dim: 128
diffusion_step_embed_dim: 128
down_dims: [256, 512, 1024]
kernel_size: 5
n_groups: 8
cond_predict_scale: true
scheduler_type: ddpm
num_diffusion_steps: 100
prediction_type: epsilon
lr_scheduler: cosine
lr_warmup_steps: 500
use_ema: true
ema_update_after_step: 0
ema_inv_gamma: 1.0
ema_power: 0.75
ema_min_value: 0.0
ema_max_value: 0.9999

sample_every: 10000
log_interval: 500
